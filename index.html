<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>'n Klein boodskap vir jou</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f5f1eb; font-family: Georgia, "Times New Roman", serif; color: #2d2520;
    }
    .card {
      width: min(92vw, 720px); margin: 32px 0; background: #fffdf9;
      border-radius: 22px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }
    .photo { width: 100%; display: block; }
    .content { padding: 34px 34px 38px; text-align: center; }
    .message { font-size: 1.25rem; line-height: 1.7; white-space: pre-line; }
    .signature { margin-top: 24px; font-size: 1.35rem; }
    .phone { margin-top: 8px; font-family: Arial, sans-serif; font-size: 1rem; }
  </style>
</head>
<body>
  <main class="card">
    <img class="photo" src="coffee.jpg" alt="Twee koppies koffie">
    <section class="content">
      <div class="message">Hi, ek dink jy is ongelooflik mooi en antreklik. Jou skoonheid
maak my eintelik te skaam om persoonlik met jou te praat, maar ek sal graag wil
weet of jy dalk saam met my op n date sal wil gaan as jy belangstel.</div>
      <div class="signature">Dieter</div>
      <div class="phone">+27 83 751 4119</div>
    </section>
  </main>
</body>
</html>
